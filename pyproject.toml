[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brown-bridge-human-real"
version = "0.1.0"
description = "Optimal-transport utilities and RAE cat/dog generation workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
demos = [
    "matplotlib>=3.10",
    "torchvision>=0.23",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/brown_bridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
